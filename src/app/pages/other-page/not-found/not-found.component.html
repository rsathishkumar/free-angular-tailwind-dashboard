<div class="relative flex flex-col items-center justify-center min-h-screen p-6 overflow-hidden z-1">
  <app-grid-shape />

  <div class="mx-auto w-full max-w-[520px]">
    <div class="mb-8 text-center">
      <h1 class="mb-2 text-2xl font-bold text-gray-800 dark:text-white/90 sm:text-3xl">
        Contact Us
      </h1>
      <p class="text-base text-gray-600 dark:text-gray-400">
        Have a question or feedback? We'd love to hear from you.
      </p>
    </div>

    <div *ngIf="!submitted" class="rounded-2xl border border-gray-200 bg-white p-6 shadow-theme-xs dark:border-gray-700 dark:bg-gray-800 sm:p-8">
      <form (ngSubmit)="onSubmit()" #contactForm="ngForm">
        <div class="mb-5">
          <label for="name" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">
            Name
          </label>
          <input
            type="text"
            id="name"
            name="name"
            [(ngModel)]="contact.name"
            required
            placeholder="Your name"
            class="w-full rounded-lg border border-gray-300 bg-transparent px-4 py-3 text-sm text-gray-800 placeholder:text-gray-400 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500 dark:border-gray-600 dark:text-white/90 dark:placeholder:text-gray-500"
          />
        </div>

        <div class="mb-5">
          <label for="email" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">
            Email
          </label>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="contact.email"
            required
            placeholder="you@example.com"
            class="w-full rounded-lg border border-gray-300 bg-transparent px-4 py-3 text-sm text-gray-800 placeholder:text-gray-400 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500 dark:border-gray-600 dark:text-white/90 dark:placeholder:text-gray-500"
          />
        </div>

        <div class="mb-5">
          <label for="subject" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">
            Subject
          </label>
          <input
            type="text"
            id="subject"
            name="subject"
            [(ngModel)]="contact.subject"
            required
            placeholder="What's this about?"
            class="w-full rounded-lg border border-gray-300 bg-transparent px-4 py-3 text-sm text-gray-800 placeholder:text-gray-400 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500 dark:border-gray-600 dark:text-white/90 dark:placeholder:text-gray-500"
          />
        </div>

        <div class="mb-6">
          <label for="message" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">
            Message
          </label>
          <textarea
            id="message"
            name="message"
            [(ngModel)]="contact.message"
            required
            rows="5"
            placeholder="Write your message here..."
            class="w-full rounded-lg border border-gray-300 bg-transparent px-4 py-3 text-sm text-gray-800 placeholder:text-gray-400 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500 dark:border-gray-600 dark:text-white/90 dark:placeholder:text-gray-500"
          ></textarea>
        </div>

        <button
          type="submit"
          [disabled]="!contactForm.valid"
          class="w-full rounded-lg bg-blue-600 px-5 py-3 text-sm font-medium text-white hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-50">
          Send Message
        </button>
      </form>
    </div>

    <div *ngIf="submitted" class="rounded-2xl border border-gray-200 bg-white p-8 text-center shadow-theme-xs dark:border-gray-700 dark:bg-gray-800">
      <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-green-100 dark:bg-green-900/30">
        <svg class="h-8 w-8 text-green-600 dark:text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
      </div>
      <h2 class="mb-2 text-xl font-semibold text-gray-800 dark:text-white/90">Thank you!</h2>
      <p class="mb-6 text-gray-600 dark:text-gray-400">Your message has been sent. We'll get back to you soon.</p>
      <a routerLink="/"
        class="inline-flex items-center justify-center rounded-lg border border-gray-300 bg-white px-5 py-3 text-sm font-medium text-gray-700 shadow-theme-xs hover:bg-gray-50 hover:text-gray-800 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-white/[0.03] dark:hover:text-gray-200">
        Back to Home Page
      </a>
    </div>
  </div>

  <p class="absolute text-sm text-center text-gray-500 -translate-x-1/2 bottom-6 left-1/2 dark:text-gray-400">
    &copy; {{ currentYear }} - TailAdmin
  </p>
</div>
